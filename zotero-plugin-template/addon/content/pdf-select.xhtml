<?xml version="1.0" encoding="UTF-8"?>
<?xml-stylesheet href="chrome://global/skin/global.css" type="text/css"?>
<dialog
  xmlns="http://www.mozilla.org/keymaster/gatekeeper/there.is.only.xul"
  id="paperflow-pdf-select"
  title="选择要翻译的 PDF"
  width="720"
  height="540"
  persist="width height screenX screenY"
  buttons="accept,cancel"
  buttonlabelaccept="确定翻译"
  buttonlabelcancel="取消"
  onload="PaperFlowPdfSelect.init()"
  ondialogaccept="return PaperFlowPdfSelect.accept()"
  style="font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif; font-size: 13px; color: #1D1D1F; background: #F5F5F7;"
>
  <script type="application/javascript"><![CDATA[
    var PaperFlowPdfSelect = {
      make: function (tag) {
        return document.createXULElement
          ? document.createXULElement(tag)
          : document.createElement(tag);
      },

      init: function () {
        var data = window.arguments && window.arguments[0];
        if (!data || !data.items) return;
        document.getElementById("pdf-hint").value =
          "共找到 " + data.items.length + " 个 PDF，勾选要翻译的文件：";
        var list = document.getElementById("pdf-list");
        var self = this;
        data.items.forEach(function (item) {
          var row = self.make("hbox");
          row.setAttribute("align", "center");
          row.style.cssText = "padding: 6px 8px; min-height: 34px; border-bottom: 1px solid #E8E8ED;";

          var cb = self.make("checkbox");
          cb.setAttribute("checked", item.checked ? "true" : "false");
          cb.style.cssText = "margin-right: 10px;";
          cb._pdfIndex = item.index;

          var textBox = self.make("vbox");
          textBox.setAttribute("flex", "1");
          textBox.style.cssText = "min-width: 0;";

          if (item.title) {
            var title = self.make("label");
            title.setAttribute("value", item.title);
            title.setAttribute("crop", "end");
            title.setAttribute("tooltiptext", item.title);
            title.style.cssText = "font-size: 11px; color: #8E8E93; max-width: 560px;";
            textBox.appendChild(title);
          }

          var file = self.make("label");
          file.setAttribute("value", item.filename);
          file.setAttribute("crop", "end");
          file.setAttribute("tooltiptext", item.filename);
          file.style.cssText = "font-size: 13px; color: #1D1D1F; max-width: 560px;";
          textBox.appendChild(file);

          row.appendChild(cb);
          row.appendChild(textBox);
          list.appendChild(row);
        });
        this.updateCount();
      },

      boxes: function () {
        var rows = document.getElementById("pdf-list").children;
        return Array.prototype.slice.call(rows).map(function (row) {
          return row.firstElementChild;
        });
      },

      selectAll: function (yes) {
        this.boxes().forEach(function (cb) { cb.checked = yes; });
        this.updateCount();
      },

      updateCount: function () {
        var boxes = this.boxes();
        var n = boxes.filter(function (cb) { return cb.checked; }).length;
        var label = document.getElementById("pdf-selected-count");
        label.value = "已选择 " + n + " / " + boxes.length + " 个 PDF";
        try {
          var accept = document.documentElement.getButton("accept");
          if (accept) accept.disabled = n === 0;
        } catch (e) {}
      },

      accept: function () {
        var data = window.arguments && window.arguments[0];
        if (data) {
          data.selected = this.boxes()
            .filter(function (cb) { return cb.checked; })
            .map(function (cb) { return cb._pdfIndex; });
        }
        return true;
      }
    };

    document.addEventListener("command", function (e) {
      if (e.target && e.target.id === "pdf-select-all") PaperFlowPdfSelect.selectAll(true);
      if (e.target && e.target.id === "pdf-select-none") PaperFlowPdfSelect.selectAll(false);
      if (e.target && e.target.tagName === "checkbox") PaperFlowPdfSelect.updateCount();
    }, false);
  ]]></script>

  <vbox flex="1" style="padding: 14px 16px;">
    <label style="font-size: 16px; font-weight: 700;">选择要翻译的 PDF</label>
    <label id="pdf-hint" style="color: #6E6E73; margin-top: 3px; margin-bottom: 10px;" />

    <hbox align="center" style="margin-bottom: 8px;">
      <button id="pdf-select-all" label="全选" style="min-width: 72px;" />
      <button id="pdf-select-none" label="全不选" style="min-width: 72px; margin-left: 6px;" />
      <spacer flex="1" />
      <label id="pdf-selected-count" style="font-weight: 700; color: #0071E3;" />
    </hbox>

    <vbox
      id="pdf-list"
      flex="1"
      style="background: #FFFFFF; border: 1px solid #D7D7DC; border-radius: 8px; padding: 4px 6px; overflow: auto;"
    />
  </vbox>
</dialog>
